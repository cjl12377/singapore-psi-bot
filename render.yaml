services:
  - type: web
    name: singapore-psi-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7     # python-telegram-bot 21.6 breaks on 3.14's stricter asyncio
      - key: BOT_TOKEN
        sync: false       # set manually in Render dashboard
      - key: WEBHOOK_URL
        sync: false       # set to your Render service URL, e.g. https://singapore-psi-bot.onrender.com
      - key: REDIS_URL
        sync: false       # redis:// connection string
      - key: ADMIN_USER_ID
        sync: false       # your numeric Telegram user ID, unlocks /stats
